name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, gd, zip, bcmath, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm install --no-audit --no-fund
          npm run build

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
